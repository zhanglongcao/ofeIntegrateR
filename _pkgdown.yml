url: https://www.zcao.space/ofeIntegrateR/

template:
  bootstrap: 5

home:
  title: Design, sample and analyse on-farm strip experiments
  description: >
    A workflow for OFE strip trials: lay out the design, plan the sampling,
    grid the yield-monitor data, find the zones, fit the spatial mixed model
    and report the means — optionally integrating sparse soil or tissue samples
    with the dense layer. Runs on open-source dependencies alone.

reference:
- title: Designing the trial
  desc: >
    Lay out the plots: strip or stacked, randomised or systematic.
  contents:
  - make_trial_design

- title: Planning the sample
  desc: >
    How many point samples the target precision needs, and where they go.
  contents:
  - kriging_sample_interval
  - place_point_samples

- title: Cleaning the raw file
  desc: >
    What a harvester records but did not really measure. Run before anything
    else: two of the defects are systematic and survive averaging.
  contents:
  - clean_yield_monitor

- title: Preparing the data
  desc: >
    Getting an irregular yield-monitor cloud onto the lattice a spatial model
    needs, and interpolating the sparse layer onto the same grid.
  contents:
  - choose_cell_size
  - grid_dense_layer
  - krige_point_samples

- title: Checking the point layer
  desc: >
    What the samples say about the scale of the variation, and whether they are
    dense enough to reconstruct their own surface.
  contents:
  - ofe_variogram
  - print.ofe_variogram
  - plot.ofe_variogram
  - cv_krige_surface

- title: Fitting the spatial model
  desc: >
    A REML engine with ASReml-style residual structures, written in base R,
    plus the tests and predicted means that go with it.
  contents:
  - fit_ofe
  - ofe_control
  - summary.ofe_fit
  - wald_tests
  - ofe_means

- title: Reporting the means
  desc: >
    Predicted means with least significant differences and the a/b/c letters a
    trial report prints beside them.
  contents:
  - ofe_lsd
  - compact_letters

- title: Finding pseudo-environments
  desc: >
    Cutting the trial into zones — across its length from the yield pattern, or
    into contiguous regions from elevation and soil — and writing the residual
    structure that follows from them.
  contents:
  - partition_pseudo_env
  - partition_paddock
  - adaptive_residual

- title: Estimating the treatment effect
  desc: >
    The two integration strategies, the free baseline they are judged against,
    and a model-agnostic way to read the contrasts out.
  contents:
  - compare_integration
  - fit_integrated_kriged
  - fit_integrated_joint
  - extract_fixed_effects

- title: Simulating trials
  desc: >
    A paddock whose truth is known, a tidy lattice for quick tests, and the
    awkward shape a real harvester produces for testing the full pipeline.
  contents:
  - simulate_paddock
  - simulate_ofe_trial
  - simulate_yield_monitor

- title: Looking at it
  desc: >
    Maps and diagnostics. A trial is a thing in a paddock, and most mistakes in
    one are visible on a map and invisible in a table.
  contents:
  - ofe_map
  - plot.ofe_design
  - plot.ofe_zones
  - plot.ofe_fit
  - ofe_palette

- title: Package
  contents:
  - ofeIntegrateR-package

articles:
- title: Get started
  navbar: ~
  contents:
  - ofe-integration
  - real-data
