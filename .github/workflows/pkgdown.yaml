# Build the documentation site and publish it to GitHub Pages.
# Derived from https://github.com/r-lib/actions/tree/v2/examples
# PAUSED while the repository is private.
#
# Cheaper than the check (one Ubuntu job, about six billed minutes a push)
# but not free, and Actions minutes are billed only for private repositories.
# Public repositories get unlimited free minutes, so this costs nothing once
# the repository is public.
#
# While it is paused the documentation site at
# https://www.zcao.space/ofeIntegrateR/ stays at whatever version last
# deployed, so it will be behind the code until this is turned back on.
#
# TO RESTORE: uncomment the two triggers below.
on:
  # push:
  #   branches: [main, master]
  # release:
  #   types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # asreml is a commercial Suggests that pak cannot resolve; name the
          # Suggests the site actually needs instead of installing "all".
          dependencies: 'c("Imports", "LinkingTo")'
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            any::sommer
            any::agridat
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
