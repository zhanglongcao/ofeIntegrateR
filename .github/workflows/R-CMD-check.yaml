# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# PAUSED while the repository is private.
#
# Actions minutes are billed only for private repositories, and this workflow
# is the expensive one: five platforms per push, with macOS billed at ten times
# its wall-clock minutes and Windows at twice. One push cost roughly 95 billed
# minutes out of the monthly allowance, which is what exhausted it.
#
# Public repositories get unlimited free minutes on standard runners, so this
# becomes free the moment the repository is made public. TO RESTORE: delete the
# `workflow_dispatch` line below, uncomment the two triggers, and put the
# R-CMD-check badge back at the top of README.md.
#
# Until then the workflow can still be started by hand from the Actions tab.
on:
  # push:
  #   branches: [main, master]
  # pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # 'asreml' is a commercial Suggests not available on any public
          # repo; pak cannot resolve it, so we install hard deps
          # (Imports/LinkingTo) and name only the Suggests the check truly
          # needs, rather than the default "all" (which would try asreml and
          # fail). knitr/rmarkdown build the vignettes.
          #
          # 'sommer' and 'agridat' are deliberately NOT installed here.
          # sommer compiles C++ and would have to build on all five matrix
          # legs for the sake of one test that already calls
          # skip_if_not_installed("sommer"); agridat is only needed by the
          # real-data article, which is written to degrade gracefully when it
          # is absent. Letting those guards do their job keeps the check fast
          # and removes two ways for it to fail for reasons unrelated to the
          # package.
          dependencies: 'c("Imports", "LinkingTo")'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          upload-results: always
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
